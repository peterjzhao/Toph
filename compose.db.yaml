# Disposable PostgreSQL for the backend tests (npm run test:backend). The app itself uses the
# hosted Supabase database; nothing here holds real data.
#
# - Binds to loopback only (127.0.0.1:54329).
# - The credentials below are test-only placeholders, never used for a hosted database.
#
# Start:  npm run test:db:up
# Stop:   npm run test:db:stop
# Wipe:   docker compose -f compose.db.yaml down -v
name: toph
services:
  db:
    image: postgres:17-alpine
    container_name: toph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: toph_owner
      POSTGRES_PASSWORD: toph_owner_local_dev_password
      POSTGRES_DB: toph_test
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - toph-postgres-data:/var/lib/postgresql/data
      # Runs only when the data volume is first initialized: creates the restricted role.
      - ./scripts/db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toph_owner -d toph_test"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  toph-postgres-data:
